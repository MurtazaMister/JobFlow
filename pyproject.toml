[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jobflow"
version = "0.1.0"
description = "CLI tool to tailor resumes for job postings"
requires-python = ">=3.11"
dependencies = [
    "typer[all]>=0.9.0",
    "pyyaml>=6.0",
    "flask>=3.0",
    "beautifulsoup4>=4.12",
    "gunicorn>=21.0",
    "pytest>=7.0",
    "psycopg2-binary>=2.9",
    "authlib>=1.3",
    "requests>=2.31",
    "cryptography>=42.0",
    "anthropic>=0.40",
    "tzdata>=2024.1; sys_platform == 'win32'",  # zoneinfo has no system tz db on Windows
]

[project.scripts]
jobflow = "jobflow.cli:app"

[tool.setuptools.packages.find]
include = ["jobflow*"]
