name: Scan LinkedIn Jobs

on:
  # Public repo -> unlimited GH Actions minutes. Scan every 30 min, 24/7.
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: # Manual trigger from Actions tab

permissions:
  contents: write

concurrency:
  group: scan-linkedin-jobs
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JOBFLOW_CONFIG: config/config.ci.yaml
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync latest JSON store
        run: git pull --ff-only origin main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install JobFlow
        run: pip install -e .

      - name: Run LinkedIn + GitHub-repo scan
        run: |
          echo "Starting scan at $(date -u)"
          echo "DATABASE_URL is set: ${{ env.DATABASE_URL != '' }}"
          # Ephemeral per-run output — prevents stale top-500 cache from
          # evicting fresh jobs and blocking DB inserts.
          rm -f data/ci/scan_results.json
          jobflow scan --platform linkedin,github --save --hours 4 2>&1 || true
          echo "Scan finished at $(date -u)"

      - name: Merge into database
        id: db_merge
        if: ${{ env.DATABASE_URL != '' }}
        continue-on-error: true
        run: |
          python -c "
          from pathlib import Path
          from jobflow.db import init_db, merge_scan_results, prune_expired_jobs
          import json

          init_db()
          scan_path = Path('data/ci/scan_results.json')
          if not scan_path.exists():
              print('No scan_results.json found, skipping merge')
              exit(0)

          scan_data = json.loads(scan_path.read_text())
          new_count = merge_scan_results(scan_data)
          pruned = prune_expired_jobs()
          print(f'Merged: {new_count} new jobs, pruned {pruned} expired')
          "

      - name: Merge into linkedin_jobs.json (backup replica)
        run: |
          python -c "
          from pathlib import Path
          from jobflow.linkedin_store import load_store, save_store, merge_scan_results, prune_old_jobs, backfill_job
          import json

          root = Path('.')
          store_path = root / 'data' / 'ci' / 'linkedin_jobs.json'
          scan_path = root / 'data' / 'ci' / 'scan_results.json'

          if not scan_path.exists():
              print('No scan_results.json found, skipping merge')
              exit(0)

          scan_data = json.loads(scan_path.read_text())
          store = load_store(store_path)
          store = merge_scan_results(store, scan_data)
          store = prune_old_jobs(store)
          for key in store.get('jobs', {}):
              store['jobs'][key] = backfill_job(store['jobs'][key])
          save_store(store_path, store)
          print(f'Merged: {len(store.get(\"jobs\", {}))} total jobs in store')
          "

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ci/
          if git diff --cached --quiet; then
            echo "No new jobs found"
          else
            COUNT=$(python -c "import json; d=json.load(open('data/ci/linkedin_jobs.json')); print(len(d.get('jobs', d)))" 2>/dev/null || echo "?")
            git commit -m "scan: LinkedIn $(date -u +%Y-%m-%dT%H:%M) — ${COUNT} jobs total"
            git pull --rebase origin main
            git push
          fi
